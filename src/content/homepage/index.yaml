introTitle: Espaces habités
introTitleEn: Space
introText: >-
  Intérieurs, architectures et paysages deviennent le cadre de scènes où la
  présence humaine, parfois discrète ou absente, fait émerger des situations de
  solitudes, d’attente ou de contemplation.


  Formé notamment à l’École polytechnique fédérale de Zurich (ETH Zürich) et à
  l’École du Louvre, Yann Jaime développe un regard où la rigueur de la
  construction dialogue avec une sensibilité profondément picturale. Ses
  compositions mettent en tension géométrie, lumière et espace, révélant autant
  la monumentalité des architectures que leur fragilité face au temps.


  Sa série Tours Nuages prolonge cette réflexion en explorant la verticalité des
  villes contemporaines et les nouvelles perceptions de l’espace qu’elles
  engendrent.
