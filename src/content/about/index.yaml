bio: >-
  Né en Suisse et revendiquant une double culture suisse et chilienne, Yann
  Jaime développe une pratique picturale centrée sur les lieux et les figures
  qui les habitent. Intérieurs, architectures et paysages deviennent le cadre de
  scènes où la présence humaine, parfois discrète ou absente, fait émerger des
  situations de solitudes, d’attente ou de contemplation.


  Formé notamment à l’École polytechnique fédérale de Zurich (ETH Zürich) et à
  l’École du Louvre, il développe un regard singulier où la rigueur de la
  construction dialogue avec une sensibilité profondément picturale. Ses
  compositions mettent en tension géométrie, lumière et espace, révélant autant
  la monumentalité des architectures que leur fragilité face au temps et aux
  transformations des sociétés.


  À travers une peinture précise et épurée, Yann Jaime fait émerger des paysages
  urbains où les figures humaines, discrètes ou absentes, laissent toute leur
  place à l’expérience des lieux. Sa série Tours Nuages prolonge cette réflexion
  en explorant la verticalité des villes contemporaines et les nouvelles
  perceptions de l’espace qu’elles engendrent.


  Lauréat du Prix spécial du 8e Gran Premio Arte Contemporanea de Milan en 2023,
  Yann Jaime construit une œuvre où architecture et peinture se rejoignent pour
  proposer une lecture sensible de nos environnements contemporains.
