title: Espaces habités
type: collective
order: 1
cover: /images/expositions/espaces-habites/cover.JPG
gallery: []
description: >
  « On peut être dans le même lieu et ne pas ressentir l'espace de la même
  manière. »

  Cette phrase, apparue au cours des échanges entre les artistes, traverse toute
  l'exposition. Les œuvres réunies ici ne représentent pas seulement des
  paysages, des appartements ou des figures solitaires. Elles parlent de manière
  dont chacun habite les lieux qu'il traverse, les transforme et y projette sa
  propre mémoire.

  Dans les œuvres de Yann Jaime, les personnages apparaissent souvent seuls au
  cœur d'architectures silencieuses. Chambres, fenêtres et paysages urbains
  deviennent les prolongements d'un état intérieur. L'espace y protège autant
  qu'il enferme.

  Karima BEN CHEIKH
descriptionEn: >
  “We can be in the same place and experience the space differently.”

  This phrase, which emerged during conversations between the artists, runs
  through the entire exhibition. The works gathered here depict more than
  landscapes, apartments or solitary figures. They explore how each of us
  inhabits the places we move through, transforms them and projects our own
  memories onto them.

  In Yann Jaime’s works, figures often appear alone within silent architectural
  settings. Rooms, windows and urban landscapes become extensions of an inner
  state. Here, space shelters as much as it confines.

  Karima BEN CHEIKH
